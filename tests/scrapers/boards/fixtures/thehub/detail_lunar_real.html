<!doctype html><html><head><title>The Hub</title></head><body><div id="__nuxt"></div><script>window.__NUXT__=(function(a,b,c,d,e,f){return {layout:"default",state:{jobs:{jobs:b,job:{description:f,id:"6a8e2cfa6f40d9d0b631fedd",publishedAt:"2026-10-06T14:57:54.189Z",isRemote:a,link:"https:\u002F\u002Fjobs.lunar.app\u002Fjobs\u002F8264790",location:e,company:{name:"Lunar"},title:"(Senior) Data Scientist",key:"lunar-1-data-scientist-8264790"}}}}}(false,null,1,{"address": "Copenhagen, Denmark", "locality": "Copenhagen", "country": "Denmark"},{"address": "Aarhus, Denmark", "locality": "Aarhus", "country": "Denmark"},"<p>Paying for things should be the easy part of life. We are working to make it so.</p><p>Lunar is a Nordic bank built around its app, with machine learning in most of what we ship. Our teams of engineers, designers and analysts work on the everyday money questions of a large customer base across the region.</p><p>We hold a full banking licence and have teams in Copenhagen, Aarhus and Stockholm.</p><p>We like short feedback loops, clear ownership and work that shows up in the product.</p><p>As a Data Scientist you will sit with the team in Aarhus, report to the engineering manager of the risk area, and help us use data and models to stop fraud, price risk and find growth.</p><p><br /></p><h4><strong>What will you do?</strong></h4><ul><li><p>Build, test and ship statistical and machine learning models for fraud alerts, payment monitoring, credit decisions, customer risk ratings and sales leads</p></li><li><p>Set up and run the experiment tracking and evaluation we use across projects — MLflow and Metaflow today — with solid hold-out sets and baselines</p></li><li><p>Explore the data and engineer features that move model quality forward</p></li><li><p>Work side by side with data engineers, analysts and the business to agree what to build and act on the results</p></li><li><p>Write up models, methods and findings so others can reuse them, and keep the team current on new ML and GenAI tools</p></li></ul><p><br /></p><h4><strong>What are we looking for in you?</strong></h4><ul><li><p>You have put machine learning models into production and looked after them there</p></li><li><p>You write good Python and know the usual ML libraries (scikit-learn, TensorFlow, PyTorch or similar)</p></li><li><p>You have used a managed ML platform in the cloud, for example AWS SageMaker or Kubeflow</p></li><li><p>You are at home in statistics, modelling and data analysis; time in banking, insurance or another regulated field is a bonus</p></li><li><p>You solve problems methodically and can explain a technical result to people outside the team</p></li></ul><p><br /></p><h4><strong>Benefits and perks</strong></h4><ul><li><p>Office four days a week. We plan, build and learn best in the same room.</p></li><li><p>New equipment. A fast laptop, a good screen and the accessories you need to work well.</p></li><li><p>Pension, health insurance and extra parental leave. Support for the long term and for family life.</p></li></ul><p><br /></p><p><strong>Does this sound like you? Send your application and we will take it from there!</strong></p><p>While you wait to hear from us, you can read more about how we work on our careers page.</p><p><em>Depending on the rules of the country you will be employed in, we may ask for a criminal record extract. Employment also requires that you are </em>not <em>registered in RKI (Ribers Kredit Information).</em></p><p><em>We welcome applicants of every background. Tell us if you need any adjustments during the hiring process.</em></p>"));</script></body></html>
