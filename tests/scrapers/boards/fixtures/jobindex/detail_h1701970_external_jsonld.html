      Machine Learning Engineer - Trackunit
    </title>
<script type="application/ld+json">{"@context": "http://schema.org/", "@type": "JobPosting", "title": "Machine Learning Engineer", "datePosted": "2026-09-25T10:24:09+02:00", "employmentType": "FULL_TIME", "hiringOrganization": {"@type": "Organization", "name": "Trackunit", "sameAs": "https://careers.trackunit.com"}, "jobLocation": [{"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "København", "addressCountry": "DK"}}, {"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "Aarhus", "addressCountry": "DK"}}, {"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "Kolding", "addressCountry": "DK"}}, {"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "Aalborg", "addressCountry": "DK"}}], "description": "&lt;p&gt;&lt;span&gt;&lt;em&gt;Most machine learning never makes it to production. Here, it has to. We are looking for an ML Engineer who takes models out of notebooks and turns them into dependable, well-kept systems that construction companies rely on when they decide how to use their machines and run their sites. You will sit between data science and software engineering and help decide how machine learning is built, shipped and improved at Trackunit.&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;&lt;h2&gt;&lt;span&gt;What’s in it for you?&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;Put machine learning to work.&lt;/strong&gt; Take models and experiments all the way to products that customers use every day to plan their fleets and their work.&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Decide how we build and run ML.&lt;/strong&gt; Have a say in the tools, the engineering habits and the deployment patterns that carry an idea from a first sketch to production and keep it improving after that.&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Solve data problems worth solving.&lt;/strong&gt; Find out what machine, sensor and context data can tell us, and which predictions and insights actually help people in construction.&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Work with people who think differently.&lt;/strong&gt; Team up with data scientists, data engineers and product teams, and mix scientific rigour with sound software engineering and a feel for the customer.&lt;/span&gt;&lt;br&gt;&lt;span&gt;&lt;strong&gt;Grow your skills and your career.&lt;/strong&gt; Join an international team that shares what it knows, gives honest feedback and backs your personal and professional growth.&lt;/span&gt;&lt;/p&gt;&lt;h1&gt;&lt;span&gt;Who are you ideally?&lt;/span&gt;&lt;/h1&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You have MLOps experience: you have taken machine learning solutions to production and kept them healthy long after the first release.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You write strong Python and follow good engineering practice, with tests, version control, code reviews and CI/CD as a matter of course.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;&lt;strong&gt;Databricks expertise is a significant advantage.&lt;/strong&gt; &lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Ideally you have built ML workflows in Databricks yourself, tracked experiments and managed models in MLflow, and deployed and watched models in production.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You know the whole ML lifecycle, from preparing features and training reproducibly to evaluation, deployment, monitoring and retraining.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You can sit down with data scientists to judge how a model performs, spot problems such as data leakage and drift, and turn experimental code into systems that can be maintained.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You have worked with cloud platforms and with tools that orchestrate ML workflows and serve predictions, and you make sensible choices between reliability, speed and cost.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;You like designing solutions together with others, you explain your technical choices clearly, and you link engineering decisions to what customers need.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Hands-on experience training, tuning and validating machine learning or deep learning models would be a plus.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;Experience with time series, sensor or geospatial data, or with distributed processing, would be a plus.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;span&gt;You do not need to know every tool or kind of data on this list. If you are a strong engineer who wants machine learning to be useful in the real world, we would like to hear from you.&lt;/span&gt;&lt;/p&gt;&lt;h3&gt;&lt;strong&gt;Our hiring process&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Skip the polished cover letter. We would rather see the impact you can make, and that rarely shows in a letter.&amp;nbsp;&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;A short video call to say hello. You meet our Talent Acquisition Partner.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;&lt;span&gt;A longer conversation: we talk about your experience and the way you work, and you get a better picture of the team, the problems we are tackling and what a normal week in the role looks like.&lt;/span&gt;&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;An interview built around the job. You get a case to prepare beforehand, close to the work you would do, and you present it to colleagues from across Trackunit whom you would work with every day.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Where needed, we ask former employers for references during the process and run background checks suited to the level of the role, unless you have already provided them.&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;We present the offer and go through it with you. Welcome aboard!&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;&lt;h3&gt;&lt;br&gt;&lt;strong&gt;Coming Together To Connect Construction&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt;&lt;p&gt;Construction is one of the biggest industries on the planet, and it is the one we have chosen. For more than twenty years Trackunit has pushed technology forward on building sites. Today we are both a leading IoT provider and a voice the industry listens to, helping to set its agenda around the world.&lt;/p&gt;&lt;p&gt;People come first in everything we do. Being human-centric is not just how we design our products – it is how we work together at Trackunit. We are a truly global team that meets in hubs around the world, and we are just as happy for you to work remotely, wherever you do your best work. Everything we do aims to cut downtime and to build the most useful industry for the world.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;So, are you in? &lt;br&gt;&lt;/strong&gt;&lt;/p&gt;"}</script>
