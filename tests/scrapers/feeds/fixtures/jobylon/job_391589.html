    "description": "\u003Cp\u003EEvery message we send is a conversation with a customer, and we want each of them to be a good one.\u003C/p\u003E\n\u003Cp\u003EOur CRM setup is in good shape: the tools are in place, the data is solid and the flows are running. What we need now is someone who looks at the customer as a whole and sets the direction. As our CRM &amp; Loyalty Manager you own the contact strategy, the way we test, and the design of our loyalty program across all markets.\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EWhat you'll do:\u003C/strong\u003E\u003Cbr\u003E\n\u2192 Own the CRM framework and decide who we contact, when and how often\u003Cbr\u003E\n\u2192 Set the testing approach, so every test follows the same method\u003Cbr\u003E\n\u2192 Design the loyalty program and measure its effect on customer behaviour\u003Cbr\u003E\n\u2192 Follow cohorts, retention and lifetime value and turn them into priorities\u003C/p\u003E\n\u003Cp\u003E\u003Cstrong\u003EWho are you?\u003C/strong\u003E\u003C/p\u003E\n\u003Cp\u003EYou think commercially, you love data and you test everything. You prioritise hard, take ownership and get people on board without needing a formal mandate.\u003C/p\u003E\n\u003Cul\u003E\n\u003Cli\u003E5+ years in CRM or lifecycle marketing in e-commerce or retail\u003C/li\u003E\n\u003Cli\u003EStrong analytical skills and a structured way of working\u003C/li\u003E\n\u003Cli\u003EFluent English; Swedish is a plus\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cp\u003EQuestions about the role? Contact Rikke Holm at kontakt@example.com.\u003C/p\u003E",
