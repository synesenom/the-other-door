<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The other door — Applications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F1E6CF}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F1E6CF; color: #1E1A16; font-family: Figtree, system-ui, sans-serif; font-size: 14px; line-height: 1.5; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px">
  <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
    <div>
      <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-size: 40px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.1">Applications</h1>
      <p style="margin: 6px 0 0; color: #5C5249; font-size: 15px">11 sent this month · 3 in interviews</p>
    </div>
    <button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #D6C7A8; border-radius: 8px; background: transparent; color: #1E1A16">Add a job by link</button>
  </header>

  <div style="overflow-x: auto; margin: 0 -48px; padding: 0 48px">
    <div style="display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 20px; min-width: 1060px">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="5">
        <section style="display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5C5249; font-weight: 600"><span>{{col.name}}</span><span style="font-variant-numeric: tabular-nums">{{col.n}}</span></h2>
          <sc-for list="{{col.cards}}" as="c" hint-placeholder-count="2">
            <button type="button" style="text-align: left; border: 1px solid #E2D5BA; border-radius: 10px; background: #F8F1E2; color: #1E1A16; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
              <span style="font-weight: 600">{{c.title}}</span>
              <span style="color: #5C5249; font-size: 13px">{{c.company}}</span>
              <span style="display: flex; align-items: center; gap: 6px; margin-top: 8px">
                <sc-for list="{{c.rounds}}" as="r" hint-placeholder-count="0">
                  <span aria-hidden="true" style="{{r}}"></span>
                </sc-for>
                <span style="color: #5C5249; font-size: 12px">{{c.note}}</span>
              </span>
            </button>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const passed = 'width: 8px; height: 8px; border-radius: 4px; background: #1E1A16;';
    const pending = 'width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; border: 2px solid #4169E1;';
    const card = (title, company, note, rounds) => ({ title, company, note, rounds: rounds || [] });
    const cols = [
      { name: 'Prepared', cards: [card('Senior Data Scientist', 'Hooli Labs', 'today'), card('Analytics Lead', 'Initech Insurance', 'yesterday')] },
      { name: 'Applied', cards: [card('ML Engineer', 'Contoso Pay', '4 days ago'), card('Data Engineer', 'Vandelay Industries', '1 week ago'), card('Forecasting Specialist', 'Globex Energy', '2 weeks ago')] },
      { name: 'Interviewing', cards: [card('Data Scientist', 'Example Health', 'technical next', [passed, passed, pending]), card('Product Analyst', 'Example Media', 'screening', [pending])] },
      { name: 'Offer', cards: [card('Quant Analyst', 'Acme Capital', 'answer by Fri', [passed, passed, passed])] },
      { name: 'Closed', cards: [card('BI Developer', 'Example Logistics', 'rejected'), card('Data Lead', 'Example Bank', 'ghosted')] }
    ];
    return { cols: cols.map(c => ({ ...c, n: String(c.cards.length) })) };
  }
}
</script>
</body>
</html>
