<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The other door — Prepared application</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0;background:#F1E6CF}
a{color:#3D5798}a:hover{color:#1E1A16}
button,textarea{font:inherit}
</style>
</helmet>
<div style="min-height: 800px; box-sizing: border-box; background: #F1E6CF; color: #1E1A16; font-family: Figtree, system-ui, sans-serif; font-size: 14px; line-height: 1.5; padding: 20px 48px 40px; display: flex; flex-direction: column; gap: 24px">

  <header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap">
    <div>
      <a href="#" style="font-size: 13px; text-decoration: none; color: #1E1A16">← Posting</a>
      <h1 style="margin: 8px 0 0; font-family: 'Young Serif', Georgia, serif; font-size: 32px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.1">Ready to send</h1>
      <p style="margin: 8px 0 0; color: #6B6157; font-size: 13px">Senior Data Scientist · Hooli Labs</p>
    </div>
    <button type="button" style="margin-top: 20px; height: 32px; padding: 0 16px; border: 0; border-radius: 0; background: #1E1A16; color: #FFFCF5; font-weight: 600; font-size: 13px">I've applied</button>
  </header>

  <div style="display: flex; gap: 12px; font-size: 13px">
    <span style="font-weight: 400; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px">CV · 2 pages</span>
    <span>Letter · 310 words</span>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

    <figure style="flex: 0 1 620px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="height: 500px; box-sizing: border-box; background: #FFFFFF; padding: 72px 100px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden" aria-hidden="true">
        <span style="display: block; width: 150px; height: 12px; border-radius: 0; background: #1E1A16"></span>
        <span style="display: block; height: 0; margin: 6px 0 10px"></span>
        <sc-for list="{{lines}}" as="w" hint-placeholder-count="20">
          <span style="display: block; height: 5px; border-radius: 0; background: #D6C7A8; width: {{w}}"></span>
        </sc-for>
      </div>
      <figcaption><button type="button" style="padding: 0; border: 0; background: none; color: #3D5798; font-weight: 600; font-size: 13px">Save CV…</button></figcaption>
    </figure>

    <aside style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <label for="revise" style="font-family: 'Young Serif', Georgia, serif; font-size: 22px; font-weight: 400">Anything to change?</label>
      <textarea id="revise" rows="3" placeholder="Change the CV: lead with the forecasting project…" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #D6C7A8; border-radius: 0; background: #FFFCF5; color: #1E1A16; resize: none"></textarea>
      <div style="display: flex; gap: 20px; align-items: center">
        <button type="button" style="height: 32px; padding: 0; border: 0; background: none; color: #3D5798; font-weight: 600; font-size: 13px">Revise</button>
        <button type="button" style="height: 32px; padding: 0; border: 0; background: none; color: #6B6157; font-weight: 600; font-size: 13px">Undo last change</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { lines: ['92%','100%','84%','96%','0%','70%','100%','88%','60%','94%','100%','0%','78%','90%','66%','100%','82%','58%','96%','74%'] };
  }
}
</script>
</body>
</html>
