<!doctype html>
<!--
  Cover letter template: the page, its fonts and its look. The tailor agent writes only the body (cover_letter.html:
  the header, the recipient, the paragraphs, the closing) from the posting and profile/cv.md, in the building blocks
  below, and `compile` puts it in the <body> (the line with the body token) and the ad's language in <html lang> (its
  lang token). Restyle every generated letter by changing the CSS; keep those two tokens and the class names.

  The fonts are served from the profile's fonts/ folder, or the code's own, as /fonts/<file>, and must be TrueType.

  Building blocks (the tailor's vocabulary):
    <header class="letter-header"><h1>Name</h1><p class="contact"><span class="phone">detail</span>...</p></header>
    Each contact span has its kind as a class: phone, email, web, location, linkedin or github; any other detail is a plain <span>.
    <div class="recipient"><p>Recipient</p><p>Company</p><p>City</p></div>
    <p class="date"><<date>></p>
    <p>a paragraph</p>
    <div class="closing"><p class="signoff">Kind regards,</p><p>Name</p></div>
-->
<html lang="<<lang>>">
<head>
<meta charset="utf-8">
<title>Cover letter</title>
<style>
@font-face { font-family: Figtree; font-weight: 400; font-style: normal; src: url(/fonts/Figtree-Regular.ttf) format("truetype"); }
@font-face { font-family: Figtree; font-weight: 400; font-style: italic; src: url(/fonts/Figtree-Italic.ttf) format("truetype"); }
@font-face { font-family: Figtree; font-weight: 600; font-style: normal; src: url(/fonts/Figtree-SemiBold.ttf) format("truetype"); }
@font-face { font-family: Figtree; font-weight: 600; font-style: italic; src: url(/fonts/Figtree-SemiBoldItalic.ttf) format("truetype"); }
@font-face { font-family: "Young Serif"; font-weight: 400; font-style: normal; src: url(/fonts/YoungSerif-Regular.ttf) format("truetype"); }
/* the fonts of the other pairs (cv_fonts, #465); a face is loaded only when the page uses it */
@font-face { font-family: "Playfair Display"; font-weight: 700; font-style: normal; src: url(/fonts/PlayfairDisplay-Bold.ttf) format("truetype"); }
@font-face { font-family: Lato; font-weight: 400; font-style: normal; src: url(/fonts/Lato-Regular.ttf) format("truetype"); }
@font-face { font-family: Lato; font-weight: 400; font-style: italic; src: url(/fonts/Lato-Italic.ttf) format("truetype"); }
@font-face { font-family: Lato; font-weight: 700; font-style: normal; src: url(/fonts/Lato-Bold.ttf) format("truetype"); }
@font-face { font-family: Lato; font-weight: 700; font-style: italic; src: url(/fonts/Lato-BoldItalic.ttf) format("truetype"); }
@font-face { font-family: Montserrat; font-weight: 700; font-style: normal; src: url(/fonts/Montserrat-Bold.ttf) format("truetype"); }
@font-face { font-family: Merriweather; font-weight: 400; font-style: normal; src: url(/fonts/Merriweather-Regular.ttf) format("truetype"); }
@font-face { font-family: Merriweather; font-weight: 400; font-style: italic; src: url(/fonts/Merriweather-Italic.ttf) format("truetype"); }
@font-face { font-family: Merriweather; font-weight: 700; font-style: normal; src: url(/fonts/Merriweather-Bold.ttf) format("truetype"); }
@font-face { font-family: Merriweather; font-weight: 700; font-style: italic; src: url(/fonts/Merriweather-BoldItalic.ttf) format("truetype"); }

@page { size: A4; margin: 2.2cm 2.4cm 2cm 2.4cm; }

/* what cv_accent and cv_fonts change (`compile` puts a :root block after this one): the heading colour and font, the text font, the strong weight, the rule under the name */
:root { --ink: #1E1A16; --muted: #6B6157; --hairline: #D6C7A8; --accent: #2F55C8;
  --heading: var(--accent); --rule: var(--accent); --heading-font: "Young Serif", serif; --text-font: Figtree, sans-serif; --heading-weight: 400; --strong: 600; }

html { font-synthesis: none; hyphens: manual; }
body { margin: 0; font: 10pt/1.4 var(--text-font); color: var(--ink); orphans: 2; widows: 2; }
p, ul, h1 { margin: 0; }
a { color: var(--accent); text-decoration: none; }
strong { font-weight: var(--strong); }
h1 { font-family: var(--heading-font); font-weight: var(--heading-weight); font-size: 28pt; line-height: 32pt; }

.letter-header { padding-bottom: 8pt; border-bottom: 0.6pt solid var(--rule); margin-bottom: 1.2cm; }
.contact { margin-top: 8pt; font-size: 9pt; color: var(--muted); }
.contact span { display: inline-block; white-space: nowrap; margin-right: 0.5em; }
.contact span:not(:last-child)::after { content: "\00B7"; margin-left: 0.5em; }

.recipient { margin-bottom: 0.6cm; }
.date { color: var(--muted); margin-bottom: 0.8cm; }
p + p { margin-top: 0.4cm; }
.recipient p + p { margin-top: 0; }
.closing { margin-top: 0.6cm; break-inside: avoid; }
.closing p + p { margin-top: 0.3cm; }
</style>
</head>
<body>
<<body>>
</body>
</html>
