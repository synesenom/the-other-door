# Danish. Word lists match whole words, case-insensitively; a trailing "*" also
# matches longer words (Danish compounds: "seniorudvikler"). Heading lists match
# as substrings of a heading line, so keep them specific enough not to occur in
# an ordinary bullet. See src/door/i18n/__init__.py.

code = "da"
name = "Danish"

names = ["danish", "dansk*"]

# The gender tags of a job title ("Sygeplejerske (m/k)"): dropped from a stored title.
title_tags = ["M/K", "K/M"]

# Danish writes compounds as one word ("intensivsygeplejerske"): a topic term of six letters or
# more also matches inside a word. Endings a plural adds ("sygeplejersker", "kontor" -> "kontorer").
compounds = true
plural_suffixes = ["er", "e", "r"]

# Generic words of a job title that name no field: left out of the content words of a keyword.
role_nouns = [
    "konsulent", "rådgiver", "medarbejder", "specialist", "partner", "ansvarlig", "chef", "leder",
    "koordinator", "assistent", "manager", "officer", "total",
]

# Connecting words that carry no meaning in a job title ("Chef for data").


# English words that mean something unrelated in Danish: an exclude keyword
# equal to one of these is not applied to a Danish ad.
false_friends = ["intern", "chef"]  # intern = internal, chef = boss

# Filler words with no topic, left out of the search keywords' content words.
stop_words = ["og", "i", "til", "for", "af", "med", "på", "en", "et", "den", "det", "som", "at"]

# Generic words that are not a skill, tool or certification by themselves: soft skills,
# months, weekdays. The facts check never claims them.
skill_stop_words = [
    "kommunikation", "ledelse", "samarbejde", "kreativitet", "fleksibilitet", "ansvar",
    "initiativ", "motivation", "analytisk", "problemløsning", "tidsstyring",
    "januar", "februar", "marts", "maj", "juni", "juli", "oktober", "december",
    "mandag", "tirsdag", "onsdag", "torsdag", "fredag", "lørdag", "søndag",
    "nu", "nuværende", "flydende", "modersmål", "grundlæggende",
]

# Generic words around an employer's name in a careers site's title.
career_site_words = ["karriere", "job", "jobs", "ledige stillinger", "stillinger", "karrieremuligheder"]

# ASCII spellings of the special letters, for comparing names across sites
# (cross-site dedup).
[transliterate]
"æ" = "ae"
"ø" = "oe"
"å" = "aa"

# The look-alike letters (and, for å, the old spelling) URL slugs fold them to:
# Hørsholm -> horsholm. Slugs that drop the letter instead (hrsholm) need no entry.
[slug_fold]
"æ" = "ae"
"ø" = "o"
"å" = "aa"

