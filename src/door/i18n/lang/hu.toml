# Hungarian. Word lists match whole words, case-insensitively; a trailing "*" also
# matches longer words (Hungarian suffixes and compounds: "fejlesztőként"). Heading lists
# match as substrings of a heading line, so keep them specific enough not to occur in
# an ordinary bullet. See src/door/i18n/__init__.py.

code = "hu"
name = "Hungarian"

names = ["hungarian", "magyar", "magyarul"]

# Hungarian writes compounds as one word: a topic term of six letters or more also matches inside
# a word. Endings of the plural ("ápolók", "fejlesztők").
compounds = true
plural_suffixes = ["k", "ak", "ek", "ok", "ök"]

# Generic words of a job title that name no field: left out of the content words of a keyword.
role_nouns = [
    "tanácsadó", "szakértő", "munkatárs", "vezető", "koordinátor", "asszisztens", "specialista",
    "partner", "manager", "officer",
]

# Filler words with no topic, left out of the search keywords' content words.
stop_words = ["és", "vagy", "a", "az", "egy", "valamint"]

# Generic words around an employer's name in a careers site's title.
career_site_words = ["karrier", "állások", "állás", "állásajánlatok", "nyitott pozíciók", "munkalehetőségek"]

