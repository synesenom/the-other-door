# French. Word lists match whole words, case-insensitively; a trailing "*" also matches longer words
# ("junior*" matches "juniors"). Heading lists match as substrings of a heading line, so keep them
# specific enough not to occur in an ordinary bullet. See src/door/i18n/__init__.py.
#
# Ads write the apostrophe straight (') or typographic (’), and the matching code does not fold one into
# the other: a phrase with an apostrophe is listed with both.

code = "fr"
name = "French"

names = ["french", "français", "francais", "francophone"]

# The gender tags of a job title ("Comptable H/F", "Infirmier (F/H/X)", "(f.h)"): dropped from a stored title,
# with or without parentheses or brackets, in any case and with spaces around the slash.
title_tags = ["H/F", "F/H", "H/F/X", "F/H/X", "M/F", "F/M", "M/F/X", "F/M/X", "H.F", "F.H"]

# French writes its words apart; a plural adds s or x ("analystes", "travaux").
compounds = false
plural_suffixes = ["s", "x"]

# Generic words of a job title that name no field: left out of the content words of a keyword.
role_nouns = [
    "chargé", "chargée", "consultant", "consultante", "responsable", "assistant", "assistante",
    "gestionnaire", "chef", "manager", "officer", "référent", "référente",
]

# English words that mean something unrelated in French: an exclude keyword equal to one of these is not
# applied to a French ad. stage = internship, chef = boss, cadre = salaried professional status (or a frame),
# poste = position, sale = dirty, car = coach or "because", formation = training.
false_friends = ["stage", "chef", "cadre", "poste", "sale", "car", "formation"]

# Filler words with no topic, left out of the search keywords' content words. "d" and "l" are the elisions
# of "d'expérience" and "l’équipe": a title is split at the apostrophe, whichever it is.
stop_words = ["et", "ou", "de", "du", "des", "d", "la", "le", "les", "l", "en", "pour", "au", "aux", "à", "un", "une", "dans", "sur", "avec"]

# Generic words that are not a skill, tool or certification by themselves: soft skills, months, weekdays.
# The facts check never claims them.
skill_stop_words = [
    "communication", "leadership", "organisation", "autonomie", "rigueur", "courant", "bilingue", "natif",
    "débutant", "confirmé", "janvier", "février", "fevrier", "mars", "avril", "mai", "juin", "juillet",
    "août", "aout", "septembre", "octobre", "novembre", "décembre", "decembre",
    "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche",
]

# Generic words around an employer's name in a careers site's title (also guessed as a career host).
career_site_words = [
    "carrieres", "carrières", "recrutement", "emploi", "emplois", "offres d'emploi", "offres d’emploi",
    "nos offres", "nous rejoindre", "rejoignez-nous",
]

