# ASCII spelling of the ligature the accent folding leaves alone (the accents themselves fold to their
# base letter). "ü" is not here: the German spelling "ue" is common.toml's.
[transliterate]
"œ" = "oe"
"æ" = "ae"

[slug_fold]
"œ" = "oe"
"æ" = "ae"

