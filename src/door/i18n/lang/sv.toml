# Swedish. Word lists match whole words, case-insensitively; a trailing "*" also
# matches longer words (Swedish compounds: "seniorutvecklare"). Heading lists match
# as substrings of a heading line, so keep them specific enough not to occur in
# an ordinary bullet. See src/door/i18n/__init__.py.

code = "sv"
name = "Swedish"

names = ["swedish", "svenska", "svensk*"]

# Swedish writes compounds as one word ("sjuksköterska", "projektledare"): a topic term of six letters or
# more also matches inside a word. Endings a plural or definite form adds ("konsulter", "utvecklare" -> "utvecklarna").
compounds = true
plural_suffixes = ["ar", "er", "or", "r", "n", "na", "en"]

# Generic words of a job title that name no field: left out of the content words of a keyword.
role_nouns = [
    "konsult", "rådgivare", "medarbetare", "specialist", "partner", "ansvarig", "chef", "ledare",
    "koordinator", "assistent", "handläggare", "manager", "officer",
]

# English words that mean something unrelated in Swedish: an exclude keyword
# equal to one of these is not applied to a Swedish ad.
false_friends = ["intern", "chef", "fast"]  # intern = internal, chef = boss, fast = permanent

# Filler words with no topic, left out of the search keywords' content words.
stop_words = ["och", "i", "på", "för", "av", "med", "till", "en", "ett", "den", "det", "som", "att", "inom", "hos"]

# Generic words that are not a skill, tool or certification by themselves: soft skills,
# months, weekdays. The facts check never claims them.
skill_stop_words = [
    "kommunikation", "ledarskap", "samarbete", "kreativitet", "flexibilitet", "ansvar",
    "initiativ", "motivation", "analytisk", "problemlösning", "tidshantering",
    "januari", "februari", "mars", "maj", "juni", "juli", "augusti", "oktober",
    "måndag", "tisdag", "onsdag", "torsdag", "fredag", "lördag", "söndag",
    "nuvarande", "flytande", "modersmål", "grundläggande",
]

# Generic words around an employer's name in a careers site's title (the one-word ones are also tried as a
# career host, "karriar.acme.se").
career_site_words = ["karriär", "karriar", "jobb", "lediga jobb", "lediga tjänster", "lediga befattningar", "lediga anställningar", "karriärmöjligheter"]

# ASCII spellings of the special letters, for comparing names across sites (cross-site dedup); the same
# as Danish for "å", which both files must spell alike.
[transliterate]
"å" = "aa"

