# Sweden. See src/door/i18n/__init__.py.

code = "se"
name = "Sweden"
names = ["sverige"]  # the country's other names an ad or a profile may use
languages = ["sv"]

currency = ["kr", "sek", "kronor", "tkr", "mkr"]
legal_suffixes = ["ab", "aktiebolag", "hb", "kb", "ek. för.", "ideell förening"]
# Words a subsidiary's or branch's name ends with that are no part of the employer's own name
# ("Hilti Svenska Aktiebolag", "Internationella Engelska Skolan i Sverige AB"); the country's names count too.
subsidiary_words = ["svenska", "svensk", "i sverige", "filial"]

# Domain ending, host labels its employers' career sites use, and whole domains of its job boards.
tlds = ["se"]
career_hosts = ["karriar", "jobb", "jobs", "careers"]
job_boards = ["arbetsformedlingen.se", "jobbsafari.se"]

# How a CV is written there (#605; sources in the pull request): photo "no" | "optional" | "expected"; whether a
# date of birth belongs on it (it is only kept when cv.md has one, never added); the page limit; the country's
# all-numeric full date.
[cv]
photo = "optional"
date_of_birth = false
max_pages = 2
date_format = "YYYY-MM-DD"

# Canonical city -> other names it goes by in ads (English and ASCII spellings, and the
# municipalities and districts around it a commuter would accept). The pre-filter keeps a
# posting whose location names any of them when the profile's `location` names the city.
[cities]
stockholm = [
    "stockholm*", "stockholms län", "storstockholm", "solna", "sundbyberg", "nacka", "kista",
    "lidingö", "lidingo", "huddinge", "täby", "taby", "danderyd", "sollentuna", "järfälla", "jarfalla",
    "södertälje", "sodertalje", "haninge", "bromma", "kungsholmen", "södermalm", "sodermalm",
    "hammarby sjöstad", "flemingsberg", "kungens kurva", "skärholmen", "skarholmen", "vällingby",
    "vallingby", "spånga", "spanga", "alvik", "johanneshov", "årsta", "arsta", "farsta", "tyresö",
    "tyreso", "botkyrka", "ekerö", "ekero", "upplands väsby", "upplands-bro", "sigtuna", "märsta", "marsta",
    "vallentuna", "österåker", "osteraker", "åkersberga", "akersberga", "värmdö", "varmdo",
]
"göteborg" = [
    "göteborg*", "goteborg*", "gothenburg", "mölndal", "molndal", "partille", "kungsbacka", "kungälv",
    "kungalv", "lerum", "härryda", "harryda", "landvetter", "västra götaland", "vastra gotaland",
    "västra götalands län", "angered", "askim", "frölunda", "frolunda", "hisingen", "öckerö", "ockero",
]
"malmö" = [
    "malmö*", "malmo*", "lund", "burlöv", "burlov", "staffanstorp", "vellinge", "limhamn", "kävlinge",
    "kavlinge", "landskrona", "eslöv", "eslov", "skåne", "skane", "skåne län", "svedala", "lomma",
    "arlöv", "arlov", "höllviken", "hollviken", "öresund", "oresund",
]
uppsala = ["uppsala*", "uppsala län", "knivsta"]
"linköping" = ["linköping*", "linkoping*", "mjärdevi", "mjardevi"]
"västerås" = ["västerås*", "vasteras*"]
"örebro" = ["örebro*", "orebro*"]
"norrköping" = ["norrköping*", "norrkoping*"]
"jönköping" = ["jönköping*", "jonkoping*"]
"umeå" = ["umeå*", "umea*"]

# City -> towns within about an hour's commute by train, which an on-site candidate accepts.
# Same word syntax as [cities]; every key is a city above. The pre-filter keeps these for `remote: "no"`.
[commute]
stockholm = [
    "uppsala", "norrtälje", "norrtalje", "nynäshamn", "nynashamn", "strängnäs", "strangnas", "gnesta",
    "bålsta", "balsta", "nykvarn", "vaxholm", "knivsta", "enköping", "enkoping",
]
