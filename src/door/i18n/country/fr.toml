# France. See src/door/i18n/__init__.py.

code = "fr"
name = "France"
names = ["république française", "republique francaise"]  # the country's other names an ad or a profile may use
languages = ["fr"]

# Salary words that are not currency ("brut", "net") are salary markers in lang/fr.toml. "euro" and "euros"
# are whole words (a prefix would match "europe").
currency = ["€", "eur", "euro", "euros", "k€"]
legal_suffixes = ["sas", "sasu", "sarl", "eurl", "sa", "snc", "scop", "sca", "se", "sci", "sep", "s.a.s.", "s.a.r.l.", "s.a."]
# Words a subsidiary's or branch's name ends with that are no part of the employer's own name; the country's names count too.
subsidiary_words = ["france", "française", "francaise", "succursale"]

# Domain ending, host labels its employers' career sites use, and whole domains of its job boards.
tlds = ["fr"]
career_hosts = ["carrieres", "carriere", "recrutement", "emploi", "jobs", "talent"]
job_boards = [
    "francetravail.fr", "pole-emploi.fr", "hellowork.com", "meteojob.com", "jobijoba.com", "free-work.com",
    "choisirleservicepublic.gouv.fr", "welcometothejungle.com", "apec.fr", "cadremploi.fr", "lefigaro.fr",
    "monster.fr", "regionsjob.com", "keljob.com", "talent.io", "jobteaser.com",
]

# How a CV is written there (#605; sources in the pull request): photo "no" | "optional" | "expected"; whether a
# date of birth belongs on it (it is only kept when cv.md has one, never added); the page limit; the country's
# all-numeric full date.
[cv]
photo = "optional"
date_of_birth = false
max_pages = 2
date_format = "DD/MM/YYYY"

# Canonical city -> other names it goes by in ads (the arrondissements, the suburbs and departments around
# it). France Travail writes a place as "75 - Paris 8e Arrondissement": a department number,
# a dash, the place. The pre-filter keeps a posting whose location names any of them when the profile's
# `location` names the city. A name with an apostrophe is listed with ' and with ’.
[cities]
paris = [
    "paris*", "île-de-france", "ile-de-france", "idf", "région parisienne", "region parisienne",
    "la défense", "la defense", "courbevoie", "puteaux", "nanterre", "boulogne-billancourt",
