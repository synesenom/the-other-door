# United Kingdom. See src/door/i18n/__init__.py.

code = "gb"
name = "United Kingdom"
# "uk" is what an ad writes (and what a bare ", UK" location part says); locality reads it as gb.
# No bare "ireland": Dublin and Ireland stay foreign, "northern ireland" is local.
names = ["uk", "u.k.", "united kingdom", "great britain", "britain", "england", "scotland", "wales", "northern ireland", "gb",
         "storbritannien", "egyesült királyság"]
languages = ["en"]

currency = ["£", "gbp", "pound", "pounds"]
legal_suffixes = ["ltd", "limited", "plc", "llp", "lp", "cic", "cio", "uk ltd", "(uk)"]
# Words a subsidiary's or branch's name ends with that are no part of the employer's own name; the country's names count too.
subsidiary_words = ["uk", "uk&i", "uk and ireland", "united kingdom", "great britain", "europe"]

# Domain endings (the first is the one `follow` joins to a guessed host: careers.acme.co.uk), host labels
# its employers' career sites use, and whole domains of its job boards.
tlds = ["co.uk", "uk", "org.uk", "ac.uk", "gov.uk", "nhs.uk"]
career_hosts = ["careers", "jobs", "recruitment", "vacancies", "work-for-us", "join-us", "working-for", "workwithus"]
job_boards = [
    "reed.co.uk", "totaljobs.com", "cv-library.co.uk", "adzuna.co.uk", "jobs.theguardian.com", "jobs.ac.uk",
    "findajob.dwp.gov.uk", "jobs.nhs.uk", "civilservicejobs.service.gov.uk", "monster.co.uk", "jobsite.co.uk",
    "cwjobs.co.uk", "technojobs.co.uk", "uk.jooble.org", "glassdoor.co.uk", "fish4.co.uk", "jobs.telegraph.co.uk",
    "leisurejobs.com", "caterer.com", "retailchoice.com",
]

# How a CV is written there (#605; sources in the pull request): photo "no" | "optional" | "expected"; whether a
# date of birth belongs on it (it is only kept when cv.md has one, never added); the page limit; the country's
# all-numeric full date.
[cv]
photo = "no"
date_of_birth = false
max_pages = 2
date_format = "DD/MM/YYYY"

