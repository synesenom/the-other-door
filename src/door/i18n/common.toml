# Data that applies whatever the country or language. See src/door/i18n/__init__.py.

# Company-form suffixes stripped before cross-site dedup compares company names
# (each country file adds its own).
legal_suffixes = ["ltd", "gmbh"]

# Words a subsidiary's or branch's name ends with that are no part of the employer's own name ("H & M Hennes &
# Mauritz GBC AB"); each country file adds its own. Only trimmed from the end of a name looked up on Wikidata.
subsidiary_words = ["gbc", "branch", "division"]

# Host labels that name no employer ("apply.acme.com"); the careers words of every language and the
# countries' `career_hosts` join them (`i18n.generic_host_labels()`).
generic_host_labels = ["www", "career", "careers", "job", "jobs", "apply", "boards", "recruiting"]

# A platform's demo or sample account, found under a big brand's name (`ats_detect.feed_looks_demo`, #435): a
# job title holding one of `demo_title_marks` or starting with one of `demo_title_prefixes` (lower case), or a
# job's text holding one of `demo_text_marks` (placeholder text).
demo_title_marks = ["(sample)", "[sample]", "(demo)", "[demo]", "(example)", "(test)", "[test]"]
demo_title_prefixes = ["copy of ", "sample job", "demo job", "test job"]
demo_text_marks = ["lorem ipsum", "dolor sit amet", "vape tattooed", "gentrify pug", "hipster ipsum", "this is a sample job"]

# Domain endings every country shares, besides each country file's `tlds`.
tlds = ["com", "net", "org", "io", "eu", "co"]

# More words around an employer's name that are no part of its URL slug (`ats_detect.slug_candidates`), besides
# every country's legal forms and names. Not for dedup: "Flugger" and "Flügger group A/S" stay two names there.
slug_suffixes = [
    "a/s", "as", "asa", "ab", "oy", "ag", "limited", "inc", "plc", "llc", "bv", "nv", "sa",
    "group", "holding", "nordic",
]

