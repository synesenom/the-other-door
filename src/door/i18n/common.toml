# Query parameters that carry a job's id in an ad link (lower case); a listing links its ads
# on another host only through these (shared systems such as SuccessFactors career2).
# Terms that mean the same in a job title: one counts for the others when a title is compared with the
# search keywords (lower case; a group is a list of equivalent words or phrases).
synonyms = [
    ["ai", "artificial intelligence", "kunstig intelligens", "mesterséges intelligencia", "intelligence artificielle", "artificiell intelligens"],
    ["ml", "machine learning", "gépi tanulás", "apprentissage automatique", "maskininlärning"],
    ["hr", "human resources", "ressources humaines", "rh"],
    ["ceo", "chief executive officer"],
    ["cfo", "chief financial officer"],
    ["coo", "chief operating officer"],
    ["rn", "registered nurse", "infirmier", "infirmière"],
    ["kam", "key account"],
    ["qa", "quality assurance", "assurance qualité"],
    ["hse", "health and safety", "hygiène sécurité environnement"],
]

job_id_params = ["career_job_req_id", "jobid", "job_id", "jobreqid", "reqid"]

# Letters of languages without a file here that a URL slug spells out ("Müller" -> "mueller").
[slug_transliterate]
"ä" = "ae"
"ö" = "oe"
"ü" = "ue"
"ß" = "ss"
