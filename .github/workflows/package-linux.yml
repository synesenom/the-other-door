name: Package (Linux)

# The packaged app on Linux: build the bundle (Python, door, Tectonic), the AppImage and the .deb, then
# smoke-test both as installed: the AppImage extracted and run, the .deb installed with apt and removed again
# (the data folder must stay). Runs on pull requests that change the packaging, on every change to main that
# goes into the app, and by hand (Actions → Package (Linux) → Run workflow); the packages are kept on the run's
# page for 14 days. About 10–15 minutes on ubuntu-latest.
on:
  pull_request:
    paths:
      - "app/electron-builder.config.cjs"
      - "app/build/**"
      - "app/scripts/bundle-python.sh"
      - "app/scripts/bundle.lock.json"
      - "app/scripts/lock_requirements.py"
      - "app/scripts/check-bundle.sh"
      - "app/scripts/after-pack.cjs"
      - "app/e2e-package/**"
      - "app/playwright.package.config.ts"
      - "app/e2e-install/**"
      - "app/playwright.install.config.ts"
      - "app/test/world/**"
      - ".github/workflows/package-linux.yml"
      # the cheap one also follows the locked packages, Python's and the app's (an Electron or electron-builder bump)
      - "poetry.lock"
      - "app/package-lock.json"
  # every change to what goes into the app builds installers to try, kept 14 days on the run's page
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "profile.example/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/package-linux.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The Python runtime, Tectonic and the wheels, keyed by what pins them.
      - name: Restore the bundle's downloads
        uses: actions/cache@v6
        with:
          path: app/.bundle-cache
          key: bundle-linux-x64-${{ hashFiles('app/scripts/bundle.lock.json', 'poetry.lock') }}

      - name: Install the app's packages
        run: npm ci

      - name: Build the bundle
        run: scripts/bundle-python.sh

      - name: Check the bundle on its own
        run: scripts/check-bundle.sh

      - name: Package the AppImage and the .deb
        run: npm run package

      - name: Smoke-test the AppImage
        run: |
          chmod +x dist/The-other-door-*-Linux.AppImage
          mkdir -p "$RUNNER_TEMP/appimage" && cd "$RUNNER_TEMP/appimage"
          "$GITHUB_WORKSPACE"/app/dist/The-other-door-*-Linux.AppImage --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE/app"
          DOOR_PACKAGED_APP="$RUNNER_TEMP/appimage/squashfs-root/the-other-door" xvfb-run -a npm run test:package

      - name: Install the .deb and smoke-test it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/the-other-door-*.deb
          DOOR_PACKAGED_APP="/opt/The other door/the-other-door" xvfb-run -a npm run test:package

      - name: Removing the .deb keeps the data folder
        run: |
          mkdir -p ~/".config/The other door/profile" && echo kept > ~/".config/The other door/profile/marker"
          sudo apt-get remove -y -qq "$(dpkg-deb -f dist/the-other-door-*.deb Package)"
          test ! -e "/opt/The other door/the-other-door"
          test "$(cat ~/".config/The other door/profile/marker")" = kept

      # The install test (#639, #18): each package installed the user's way, then set-up, the first run and
      # Prepare (the bundled Tectonic's first LaTeX download), quit and reopened.
      # An AppImage needs FUSE 2, which Ubuntu 24.04 no longer ships (docs/manual-app.md says so to users).
      - name: The install test (AppImage)
        run: |
          sudo apt-get install -y -qq libfuse2t64
          DOOR_INSTALLER="$(ls dist/The-other-door-*-Linux.AppImage)" xvfb-run -a npm run test:install

      - name: The install test (.deb)
        run: DOOR_INSTALLER="$(ls dist/the-other-door-*.deb)" DOOR_INSTALLER_KIND=deb xvfb-run -a npm run test:install

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-linux
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the packages for 14 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-other-door-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
          retention-days: 14
          if-no-files-found: ignore
