name: Package (macOS)

# The packaged app on macOS, on Apple silicon (macos-14) and Intel (macos-15-intel): build the bundle and the
# .dmg, install it the way a user does (mount, copy into Applications) and smoke-test it. It is not marked as
# downloaded: an unsigned app with the quarantine flag waits for a person at Gatekeeper's prompt. This is where
# the ad-hoc signing (scripts/after-pack.cjs) is proven: Apple silicon refuses an unsigned binary. Runs on pull
# requests that change the packaging, on every change to main that goes into the app, and by hand
# (Actions → Package (macOS) → Run workflow); the .dmg is kept on the run's page for 14 days.
on:
  pull_request:
    paths:
      - "app/electron-builder.config.cjs"
      - "app/build/**"
      - "app/scripts/bundle-python.sh"
      - "app/scripts/bundle.lock.json"
      - "app/scripts/lock_requirements.py"
      - "app/scripts/check-bundle.sh"
      - "app/scripts/after-pack.cjs"
      - "app/e2e-package/**"
      - "app/playwright.package.config.ts"
      - ".github/workflows/package-macos.yml"
      - "poetry.lock"
      - "app/package-lock.json"
  # every change to what goes into the app builds installers to try, kept 14 days on the run's page
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "profile.example/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/package-macos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Restore the bundle's downloads
        uses: actions/cache@v6
        with:
          path: app/.bundle-cache
          key: bundle-macos-${{ matrix.arch }}-${{ hashFiles('app/scripts/bundle.lock.json', 'poetry.lock') }}

      - name: Install the app's packages
        run: npm ci

      - name: Build the bundle
        run: scripts/bundle-python.sh

      - name: Check the bundle on its own
        run: scripts/check-bundle.sh

      - name: Package the .dmg
        run: npm run package

      - name: Install it like a user
        run: |
          mnt="$(hdiutil attach -nobrowse -readonly dist/the-other-door-*-mac-${{ matrix.arch }}.dmg | tail -1 | awk -F'\t' '{print $NF}')"
          mkdir -p ~/Applications
          cp -R "$mnt/The other door.app" ~/Applications/
          hdiutil detach -quiet "$mnt"
          codesign --verify --deep --strict "$HOME/Applications/The other door.app"
          echo "DOOR_PACKAGED_APP=$HOME/Applications/The other door.app/Contents/MacOS/The other door" >> "$GITHUB_ENV"

      - name: Smoke-test the installed app
        run: npm run test:package

      - name: Keep the .dmg for 14 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-other-door-macos-${{ matrix.arch }}
          path: app/dist/*.dmg
          retention-days: 14
          if-no-files-found: ignore
