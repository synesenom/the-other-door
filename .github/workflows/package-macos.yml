name: Package (macOS)

# The packaged app on macOS, on Apple silicon (macos-15) and Intel (macos-15-intel): build the bundle and the
# .dmg, install it the way a user does (mount, copy into Applications) and smoke-test it. It is not marked as
# downloaded: an unsigned app with the quarantine flag waits for a person at Gatekeeper's prompt. This is where
# the ad-hoc signing (scripts/after-pack.cjs) is proven: Apple silicon refuses an unsigned binary. Runs on pull
# requests that change what goes into the app, and by hand
# (Actions → Package (macOS) → Run workflow); the .dmg is kept on the run's page for 14 days.
on:
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "profile.example/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".claude/agents/**"
      - ".github/workflows/package-macos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The same key as seed-caches.yml, which keeps it on main (#80)
      - name: Restore the bundle's downloads
        uses: actions/cache@v6
        with:
          path: app/.bundle-cache
          key: bundle-macos-${{ matrix.arch }}-${{ hashFiles('app/scripts/bundle.lock.json', 'src/door/core/chromium_pin.json', 'poetry.lock') }}

      - name: Install the app's packages
        run: npm ci

      - name: Build the bundle
        run: scripts/bundle-python.sh

      - name: Check the bundle on its own
        run: scripts/check-bundle.sh

      # The updater's .zip is only the release's (release.yml)
      - name: Package the .dmg
        run: npm run package -- --mac dmg

      - name: Install it like a user
        run: |
          mnt="$(hdiutil attach -nobrowse -readonly dist/the-other-door-*-mac-${{ matrix.arch }}.dmg | tail -1 | awk -F'\t' '{print $NF}')"
          mkdir -p ~/Applications
          cp -R "$mnt/The other door.app" ~/Applications/
          hdiutil detach -force -quiet "$mnt"
          codesign --verify --deep --strict "$HOME/Applications/The other door.app"
          echo "DOOR_PACKAGED_APP=$HOME/Applications/The other door.app/Contents/MacOS/The other door" >> "$GITHUB_ENV"

      - name: Smoke-test the installed app
        run: npm run test:package

      # The install test (#639, #18): the .dmg installed the user's way into a throwaway folder, then set-up,
      # the first run and Prepare (the bundled Tectonic's first LaTeX download), quit and reopened.
      - name: The install test
        run: DOOR_INSTALLER="$(ls dist/the-other-door-*-mac-${{ matrix.arch }}.dmg)" npm run test:install

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-macos-${{ matrix.arch }}
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the .dmg for 14 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-other-door-macos-${{ matrix.arch }}
          path: app/dist/*.dmg
          retention-days: 14
          if-no-files-found: ignore
