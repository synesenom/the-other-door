name: CLI journeys

# The real ./door (door.cmd on Windows) end to end in the test world (#33, tests/cli_journeys/) on Linux, Windows
# and macOS: after setup.sh / setup.ps1 on a fresh checkout, `init` (from a CV in Danish, French, Hungarian and
# Swedish, #135), `find`, `jobs show`, `jobs prepare` and `jobs status` against the stand-in claude and print of
# app/test/world. This replaces the manual fresh-clone check.
# setup runs with --no-claude --no-chromium: the world's stand-ins take the place of claude and Chromium (its print stand-in), so no network install.
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/setup.*"
      - "app/test/world/**"
      - "tests/cli_journeys/**"
      - "tests/cli_world.py"
      - "tests/paths.py"
      - "tests/pdf_utils.py"
      - "tests/style/fixtures/styles/scrubbed-altacv-icons-fr.pdf"
      - "profile.example/**"
      - "app/package.json"
      - "app/package-lock.json"
      - "door"
      - "door.cmd"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/cli-journeys.yml"
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the run it makes pointless
# (Windows minutes count double, macOS ten times).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS run on main and by hand; a pull request runs Linux only (they cost 2x and 10x).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./scripts/setup.sh --yes --no-claude --no-chromium || [ $? -eq 1 ]
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\setup.ps1 --yes --no-claude --no-chromium
          if ($LASTEXITCODE -notin 0, 1) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:APPDATA\Python\Scripts"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.local\bin"
          $global:LASTEXITCODE = 0

      # setup ends 1 for the Chromium and claude it was told to skip; check that nothing else is missing.
      - name: Check the set-up
        shell: bash
        run: PYTHONPATH=src poetry run python tests/cli_journeys/check_setup.py

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Python writes the path itself (no trailing carriage return from a Windows shell).
      - name: Point the world's stand-ins at the Poetry interpreter
        shell: bash
        run: |
          poetry run python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a').write('DOOR_PYTHON=' + sys.executable + '\n')"
          grep -q '^DOOR_PYTHON=.' "$GITHUB_ENV" || { echo "DOOR_PYTHON is empty"; exit 1; }

      # The unit tests of the world's edges, hook and scripted prompts: no other job runs them when only app/test/world changes.
      - name: Unit tests of the test world
        shell: bash
        run: poetry run pytest -m "not cli_journeys" -n 0 -p no:cacheprovider tests/cli_journeys

      - name: CLI journeys
        shell: bash
        env:
          DOOR_CLI_JOURNEYS_REQUIRED: "1"
        run: poetry run pytest -m cli_journeys -n 0 -p no:cacheprovider tests/cli_journeys
