name: Live smoke tests

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # commits docs/badges/live-smoke.md and the live-*.svg badges
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung site must not burn hours of Actions time (#576)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run live smoke tests
        run: >-
          ./scripts/run-test.sh --live
          -m "live and not acceptance"
          --ignore=tests/scrapers/discovery
          --junitxml=smoke-junit.xml

      # The README shows the committed badge SVGs, one per list (GitHub's workflow badge
      # can only say whether the whole run passed), each linked to its list on the page.
      # CI has no Claude plan, so the matcher's golden set is skipped here and its list
      # keeps the last local result.
      - name: Write the status page and badges
        if: always()
        run: >-
          poetry run python scripts/smoke_report.py smoke-junit.xml docs/badges/live-smoke.md
          --badges docs/badges
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit the status page and badges
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/live-smoke.md docs/badges/live-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update live smoke status [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      # Make a scheduled failure visible: open/update a single pinned issue
      # instead of relying on someone noticing the Actions tab (issue #132).
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Live smoke tests failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = results.items.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled live smoke test run failed: ${runUrl}\n\nThis issue is auto-managed — it will be closed automatically once a run succeeds.`,
              });
            }

      # Close the pinned issue (if any) once the workflow is green again.
      - name: Close failure issue if green again
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Live smoke tests failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = results.items.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Run is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
