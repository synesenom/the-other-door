name: Live smoke tests

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # commits docs/badges/live-smoke.md and the live-*.svg badges
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung site must not burn hours of Actions time (#576)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run live smoke tests
        run: >-
          ./scripts/run-test.sh --live
          -m "live and not acceptance"
          --ignore=tests/scrapers/discovery
          --junitxml=smoke-junit.xml

      # The README shows the committed badge SVGs, one per list (GitHub's workflow badge
      # can only say whether the whole run passed), each linked to its list on the page.
      # CI has no Claude plan, so the matcher's golden set is skipped here and its list
      # keeps the last local result.
      - name: Write the status page and badges
        if: always()
        run: >-
          poetry run python scripts/smoke_report.py smoke-junit.xml docs/badges/live-smoke.md
          --badges docs/badges
          --unreached smoke-unreached.md
          --changed smoke-changed.md
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit the status page and badges
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/live-smoke.md docs/badges/live-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update live smoke status [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      # Make a scheduled failure visible: open/update a single pinned issue
      # instead of relying on someone noticing the Actions tab (issue #132).
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const title = "Live smoke tests failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // The sites that changed and their modes (scripts/smoke_report.py --changed), when the report was written.
            const changed = fs.existsSync("smoke-changed.md") ? fs.readFileSync("smoke-changed.md", "utf8").trim() : "";
            const what = changed ? `\n\nChanged:\n\n${changed}` : "";

            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = results.items.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing: ${runUrl}${what}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The scheduled live smoke test run failed: ${runUrl}${what}\n\nThis issue is auto-managed — it will be closed automatically once a run succeeds.`,
              });
            }

      # A site that refuses the runner is "not reached", not a failure (tests/live_utils.py): only a change
      # fails the run above. One not reached for 3 runs in a row gets an issue of its own, closed once
      # every site was reached again (by this run or a local one merged into the page).
      - name: Open, update or close the not-reached issue
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const title = "Live smoke: sites not reached for weeks";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const flagged = fs.existsSync("smoke-unreached.md") ? fs.readFileSync("smoke-unreached.md", "utf8").trim() : "";

            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = results.items.find((issue) => issue.title === title);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            if (flagged && existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body: `Still not reached (${runUrl}):\n\n${flagged}` });
            } else if (flagged) {
              await github.rest.issues.create({
                ...repo,
                title,
                body: `These sites refused the weekly run, or could not be reached, for 3 runs in a row (${runUrl}):\n\n${flagged}\n\nA local run reaches most of them: run their live tests, then \`poetry run python scripts/smoke_report.py\` on the report (docs/architecture.md, "live-smoke"). This issue is auto-managed: it closes once every site was reached again.`,
              });
            } else if (existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number, body: `Every site was reached again: ${runUrl}` });
              await github.rest.issues.update({ ...repo, issue_number: existing.number, state: "closed" });
            }

      # Close the pinned issue (if any) once the workflow is green again.
      - name: Close failure issue if green again
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const title = "Live smoke tests failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // The sites that changed and their modes (scripts/smoke_report.py --changed), when the report was written.
            const changed = fs.existsSync("smoke-changed.md") ? fs.readFileSync("smoke-changed.md", "utf8").trim() : "";
            const what = changed ? `\n\nChanged:\n\n${changed}` : "";

            const { data: results } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const existing = results.items.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Run is green again: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
