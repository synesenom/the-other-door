name: App tests

# The desktop app (app/): type check, unit tests, the end-to-end smoke test and the phone app's test,
# and every journey (#121), which build the app and drive it against the real Python server, split
# over four runners. So it runs when the app or the server's code changes, not for docs or Python
# tests alone.
# The paths are what the app, its build and the journeys read: the server's code and its agent prompts,
# the example CV (journeys/helpers/profile.ts), the design tokens (gen-theme, before every build).
# On main too, so two PRs green apart that break a journey together show at once.
on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "profile.example/**"
      - "docs/design/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "profile.example/**"
      - "docs/design/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/app.yml"

# A newer push to the same pull request cancels the run it makes pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # Restore only: the Offline tests workflow saves this cache under the same key.
      - name: Restore the Poetry virtualenv
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-

      - name: Install dependencies
        run: poetry install

      - name: Point the app at the Poetry interpreter
        run: echo "DOOR_PYTHON=$(poetry run which python)" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Type check
        working-directory: app
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm test

      # Builds the app first (npm run build), so the build is checked here too.
      - name: End-to-end smoke test
        working-directory: app
        run: xvfb-run -a npm run test:e2e
        env:
          CI: "1"

      # The phone app (#303): its web build against a real `door serve` on made-up data, at phone sizes.
      - name: Install WebKit for the phone test (an iPhone in Safari)
        working-directory: app
        run: npx playwright install --with-deps webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"

      - name: Phone app end-to-end test
        working-directory: app
        run: xvfb-run -a npm run test:web
        env:
          CI: "1"

  # Every journey (app/journeys), a quarter each: the user's paths through the built app against the
  # real server in a test world (app/test/world), whose stand-ins run on DOOR_PYTHON. A journey that
  # passes only on its retry is flaky: a warning, not a failure (playwright.journeys.config.ts).
  journeys:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      # Restore only: the Offline tests workflow saves this cache under the same key.
      - name: Restore the Poetry virtualenv
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-

      - name: Install dependencies
        run: poetry install

      - name: Point the app at the Poetry interpreter
        run: echo "DOOR_PYTHON=$(poetry run which python)" >> "$GITHUB_ENV"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Journeys ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: app
        run: xvfb-run -a npm run test:journeys -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: "1"

      - name: Keep this quarter's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: app/blob-report
          retention-days: 1

  # The four quarters' reports as one HTML report, the journeys-report artifact.
  journeys-report:
    if: ${{ !cancelled() }}
    needs: journeys
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/package.json
          sparse-checkout-cone-mode: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the quarters' reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # The Playwright the journeys ran on, without installing the app's dependencies. A report that will
      # not merge (a registry hiccup, no shard got far enough to write one) never turns the run red:
      # the shards' own results are the verdict.
      - name: Merge them
        continue-on-error: true
        run: |
          version="$(node -p "require('./app/package.json').devDependencies['@playwright/test']")"
          npx -y -p "@playwright/test@$version" playwright merge-reports --reporter html all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: journeys-report
          PLAYWRIGHT_HTML_OPEN: never

      - name: Keep the journeys report
        uses: actions/upload-artifact@v7
        with:
          name: journeys-report
          path: journeys-report
          retention-days: 7
          if-no-files-found: ignore
