name: Package (Windows)

# The packaged app on Windows: build the bundle (Python, door, Tectonic) and the NSIS installer, install it
# silently for this user (no admin), smoke-test the installed app, then uninstall silently: the app goes, the
# data folder (%APPDATA%\The other door) stays. Runs on pull requests that change the packaging, on every change
# to main that goes into the app, and by hand (Actions → Package (Windows) → Run workflow); the installer is
# kept on the run's page for 14 days. About 15–20 minutes on windows-latest.
on:
  pull_request:
    paths:
      - "app/electron-builder.config.cjs"
      - "app/build/**"
      - "app/scripts/bundle-python.ps1"
      - "app/scripts/bundle.lock.json"
      - "app/scripts/lock_requirements.py"
      - "app/e2e-package/**"
      - "app/playwright.package.config.ts"
      - "app/e2e-install/**"
      - "app/playwright.install.config.ts"
      - "app/test/world/**"
      - ".github/workflows/package-windows.yml"
      - "poetry.lock"
      - "app/package-lock.json"
  # every change to what goes into the app builds installers to try, kept 14 days on the run's page
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "profile.example/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/package-windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Restore the bundle's downloads
        uses: actions/cache@v6
        with:
          path: app/.bundle-cache
          key: bundle-windows-x64-${{ hashFiles('app/scripts/bundle.lock.json', 'poetry.lock') }}

      - name: Install the app's packages
        run: npm ci

      - name: Build the bundle
        run: ./scripts/bundle-python.ps1

      - name: Package the installer
        run: npm run package

      - name: Install it silently, for this user
        run: |
          $installer = Get-ChildItem dist\the-other-door-*.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S'
          # a per-user install goes under %LOCALAPPDATA%\Programs; find it rather than guess the folder's name
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 2 -Filter 'the-other-door.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 1 | Select-Object FullName; throw 'the-other-door.exe was not installed under %LOCALAPPDATA%\Programs' }
          Write-Host "installed at $($exe.FullName)"
          "DOOR_PACKAGED_APP=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DOOR_INSTALL_DIR=$($exe.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Smoke-test the installed app
        run: npm run test:package

      - name: Uninstall silently; the data stays
        run: |
          $data = Join-Path $env:APPDATA 'The other door\profile'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          'kept' | Set-Content (Join-Path $data 'marker')
          $uninstaller = Get-ChildItem $env:DOOR_INSTALL_DIR -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $uninstaller.FullName -ArgumentList '/S'
          Start-Sleep -Seconds 10
          if (Test-Path $env:DOOR_PACKAGED_APP) { throw 'the app is still installed' }
          if ((Get-Content (Join-Path $data 'marker')) -ne 'kept') { throw 'the data folder was removed' }

      # The install test (#639, #18): the installer run the user's way into a throwaway folder, then set-up, the
      # first run and Prepare (the bundled Tectonic's first LaTeX download), quit and reopened.
      - name: The install test
        run: |
          $env:DOOR_INSTALLER = (Get-ChildItem dist\the-other-door-*.exe | Select-Object -First 1).FullName
          $env:DEBUG = "pw:browser"   # the app's own output in the log
          npm run test:install

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-windows-x64
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the installer for 14 days
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: the-other-door-windows
          path: app/dist/*.exe
          retention-days: 14
          if-no-files-found: ignore

  # Windows on ARM (a Surface Pro 11): the x64 installer, emulated, as such a user installs it (#18).
  windows-arm:
    needs: windows
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's packages
        run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: the-other-door-windows
          path: app/dist

      - name: The install test, x64 under emulation
        run: |
          $env:DOOR_INSTALLER = (Get-ChildItem dist\the-other-door-*.exe | Select-Object -First 1).FullName
          $env:DEBUG = "pw:browser"   # the app's own output in the log
          npm run test:install

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-windows-arm
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore
