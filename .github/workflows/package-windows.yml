name: Package (Windows)

# The packaged app on Windows: build the bundle (Python, door, Chromium) and the NSIS installer, install it
# silently for this user (no admin), smoke-test the installed app and run the install test on that same install (#168),
# then uninstall silently: the app goes, the
# data folder (%APPDATA%\The other door) stays. Runs on pull requests that change the packaging itself, on main for any change to what goes into the app, and by hand (Actions → Package (Windows) → Run workflow); the installer is
# kept on the run's page for 14 days. The installer is built
# once; the x64 and the ARM install tests then run side by side, about 10 minutes in all.
on:
  pull_request:
    paths:
      - "app/scripts/**"
      - "app/electron-builder.config.cjs"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/src/main/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "src/door/core/downloads/chromium_pin.json"
      - ".github/workflows/package-windows.yml"
  # Everything else is checked once it is on main, not on every pull request (slow, and macOS and Windows minutes cost 10x and 2x).
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "profile.example/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".claude/agents/**"
      - ".github/workflows/package-windows.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the installer once; the x64 and ARM install tests then run side by side (#136).
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The same key as seed-caches.yml, which keeps it on main (#80)
      - name: Restore the bundle's downloads
        uses: actions/cache@v6
        with:
          path: app/.bundle-cache
          key: bundle-windows-x64-${{ hashFiles('app/scripts/bundle.lock.json', 'src/door/core/downloads/chromium_pin.json', 'poetry.lock') }}

      - name: Install the app's packages
        run: npm ci

      - name: Build the bundle
        run: ./scripts/bundle-python.ps1

      - name: Package the installer
        run: npm run package

      - name: Keep the installer for 14 days
        uses: actions/upload-artifact@v7
        with:
          name: the-other-door-windows
          path: app/dist/*.exe
          retention-days: 14
          if-no-files-found: error

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's packages
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: the-other-door-windows
          path: app/dist

      - name: Unit tests, on this system as the release runs them
        run: npx vitest run

      - name: Install it silently, for this user
        run: |
          $installer = Get-ChildItem dist\The-other-door-*-Windows.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S'
          # a per-user install goes under %LOCALAPPDATA%\Programs; find it rather than guess the folder's name
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 2 -Filter 'the-other-door.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Depth 1 | Select-Object FullName; throw 'the-other-door.exe was not installed under %LOCALAPPDATA%\Programs' }
          Write-Host "installed at $($exe.FullName)"
          "DOOR_PACKAGED_APP=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DOOR_INSTALL_DIR=$($exe.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Smoke-test the installed app
        run: npm run test:package

      # The install test (#639, #18) on that same install (#168: DOOR_INSTALLED_APP, no second install): set-up,
      # the first run and Prepare, quit and reopened.
      - name: The install test
        run: |
          $env:DOOR_INSTALLED_APP = $env:DOOR_PACKAGED_APP
          $env:DEBUG = "pw:browser"   # the app's own output in the log
          npm run test:install

      - name: Uninstall silently; the data stays
        run: |
          $data = Join-Path $env:APPDATA 'The other door\profile'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          'kept' | Set-Content (Join-Path $data 'marker')
          # what still runs from the install folder holds it (#111): a server the app's quit did not wait for
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$env:DOOR_INSTALL_DIR\", 'OrdinalIgnoreCase') } | Stop-Process -Force -ErrorAction SilentlyContinue
          $uninstaller = Get-ChildItem $env:DOOR_INSTALL_DIR -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $uninstaller.FullName -ArgumentList '/S'
          # the uninstaller hands over to a temporary copy and returns at once
          for ($i = 0; $i -lt 30 -and (Test-Path $env:DOOR_INSTALL_DIR); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $env:DOOR_INSTALL_DIR) { throw "the uninstaller left $env:DOOR_INSTALL_DIR behind" }
          if ((Get-Content (Join-Path $data 'marker')) -ne 'kept') { throw 'the data folder was removed' }

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-windows-x64
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore

  # Windows on ARM (a Surface Pro 11): the x64 installer, emulated, as such a user installs it (#18).
  windows-arm:
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci takes over 2 minutes on this runner, cache or not: unpacking 497 packages on its disk, not the
      # install scripts (under a second) nor Defender (#167). One restore of node_modules takes seconds; seed-caches.yml
      # keeps it on main.
      - name: Restore the app's packages
        id: modules
        uses: actions/cache@v6
        with:
          path: app/node_modules
          key: node-modules-windows-arm64-${{ hashFiles('app/package-lock.json') }}

      - name: Install the app's packages
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: the-other-door-windows
          path: app/dist

      - name: The install test, x64 under emulation
        run: |
          $env:DOOR_INSTALLER = (Get-ChildItem dist\The-other-door-*-Windows.exe | Select-Object -First 1).FullName
          $env:DEBUG = "pw:browser"   # the app's own output in the log
          npm run test:install

      - name: Keep the install test's report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: install-report-windows-arm
          path: app/install-report
          retention-days: 14
          if-no-files-found: ignore
