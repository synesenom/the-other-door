# Weekly dependency updates, grouped so each ecosystem opens at most one pull request for minor
# and patch versions; a major version opens its own. Security updates come as they are found.
# A new version is offered only once it has been out for a while (cooldown), so a broken or
# compromised release has time to be noticed and pulled first; security updates skip the wait.
version: 2
updates:
  - package-ecosystem: pip          # Poetry: pyproject.toml and poetry.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # mcp 2.x renamed FastMCP and changed the server API: moving is its own change (#14).
      - dependency-name: mcp
        update-types: [version-update:semver-major]
      # cryptography 49 and later ship no Intel macOS wheel, and the app is still built for Intel Macs
      # (pyproject.toml keeps it below 49).
      - dependency-name: cryptography
        versions: [">=49"]

  - package-ecosystem: npm          # the desktop app
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      app:
        update-types: [minor, patch]
    ignore:
      # Electron is pinned on one major line (CLAUDE.md); moving it is a deliberate change.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # TypeScript 7 needs a declaration for the side-effect CSS imports first (#15).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The app runs on Node 22: its types stay on the same major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions:
        patterns: ["*"]
