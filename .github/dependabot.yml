# Weekly dependency updates, grouped so each ecosystem opens at most one pull request for its
# version updates (majors included) and one for its security updates, which come as they are found.
# A new version is offered only once it has been out for a while (cooldown), so a broken or
# compromised release has time to be noticed and pulled first; security updates skip the wait.
version: 2
updates:
  - package-ecosystem: pip          # Poetry: pyproject.toml and poetry.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm          # the desktop app
    directory: /app
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      app:
        applies-to: version-updates
        patterns: ["*"]
      app-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Electron is pinned on one major line (CLAUDE.md); moving it is a deliberate change.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # The app runs on Node 22: its types stay on the same major.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
